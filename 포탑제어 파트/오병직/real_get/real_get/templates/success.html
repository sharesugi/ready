<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>전송 완료 + Tank Simulator</title>
<style>
/* --- 기존 스타일 그대로 유지 --- */
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    background-color: #e8ede4;
}
.header {
    background-image: url('https://www.transparenttextures.com/patterns/green-camo.png');
    background-color: #354d28;
    background-repeat: repeat;
    background-size: contain;
    color: #fff;
    padding: 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    text-shadow: 1px 1px 2px #000;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}
.header-title {
    font-size: 40px;
    font-weight: bold;
    flex-grow: 1;
    text-align: center;
}
.header-flag img {
    width: 80px;
    border-radius: 3px;
    border: 1px solid #ddd;
}
.content-wrapper {
    display: grid;
    grid-template-columns: 1fr;
    justify-items: center;
    align-items: flex-start;
    gap: 40px;
    max-width: 1200px;
    margin: 60px auto;
}
.simulator-container {
    background: linear-gradient(145deg, #f0f0f0, #cacaca);
    border-radius: 25px;
    box-shadow: 8px 8px 15px #bebebe, -8px -8px 15px #ffffff;
    padding: 25px;
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 650px;
}
#mapCanvas {
    width: 600px;
    height: 500px;
    border-radius: 20px;
    box-shadow: inset 0 0 15px rgba(0,0,0,0.1), 4px 4px 12px rgba(0,0,0,0.2);
    background-image: url("{{ url_for('static', filename='images/KakaoTalk_20250619_095344651.png') }}");
    background-size: cover;
    background-position: center;
}
#countdownOverlay {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 120px;
    font-weight: bold;
    color: #ff3d3d;
    display: none;
    pointer-events: none;
    z-index: 1000;
}
.countdown-number {
    animation: popAndFade 1s ease-out;
}
@keyframes popAndFade {
    0% {
        transform: scale(1);
        opacity: 1;
    }
    80% {
        transform: scale(1.5);
        opacity: 1;
    }
    100% {
        transform: scale(2);
        opacity: 0;
    }
}
@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
.card {
    background: linear-gradient(135deg, #fefefe, #f5f7fa);
    padding: 35px 30px;
    border-radius: 20px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    border: 1px solid rgba(0,0,0,0.08);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    margin-top: 30px;
    text-align: center;
}
.card:hover {
    transform: translateY(-4px);
    box-shadow: 0 50px 28px rgba(0,0,0,0.12);
}
.card h2 {
    margin-top: 0;
    color: #2e2e2e;
    font-size: 28px;
    font-weight: bold;
    padding-bottom: 10px;
    border-bottom: 3px solid #4CAF50;
}
.card p {
    font-size: 22px;
    color: #444;
    text-align: center;
    margin: 20px 0 0 0;
    background-color: #ffffffaa;
    padding: 10px 0;
    border-radius: 12px;
    box-shadow: inset 0 1px 4px rgba(0,0,0,0.05);
}
#statusText {
    font-size: 20px;
    color: #2e2e2e;
    text-align: center;
    padding: 15px;
    margin-top: 20px;
    background: #f0f9f0;
    border-left: 6px solid #4CAF50;
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    font-weight: 600;
}
.status-box {
    margin: 20px auto 0 auto;
    padding: 15px;
    border-radius: 12px;
    font-size: 20px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    border: 2px solid #ccc;
    background: #ffffffaa;
    box-shadow: 0px 4px 12px rgba(0,0,0,.1);
    transition: all 0.3s ease;
}
.status-box.good {
    border-color: #2ecc71;
    color: #2ecc71;
    background: #e9f9ef;
}
.status-box.warning {
    border-color: #f1c40f;
    color: #f39c12;
    background: #fff9e5;
}
.status-box.danger {
    border-color: #e74c3c;
    color: #e74c3c;
    background: #ffecec;
}
</style>
</head>
<body>
    <div class="header">
        <div class="header-title">🪖 TANK 중앙 긴급구조 통제단</div>
        <div class="header-flag">
            <img src="https://flagcdn.com/w80/kr.png" alt="대한민국 국기" />
        </div>
    </div>
    <div class="content-wrapper">
        <div class="simulator-container">
            <h1>🚀 이동 경로 확인</h1>
            <canvas id="mapCanvas" width="600" height="500"></canvas>
            
            <!-- 카운트다운 및 발사 메시지 -->
            <div id="countdownOverlay"></div>
            
            <div class="card">
                <h2 id="destTitle">📡 목적지 1 전송 완료</h2>
                <p id="destCoords">📍 좌표: (0, 0)</p>
                <div id="statusText" style="display:none;">임무 종료</div>

                <div id="detectionStatus" class="status-box" style="display:flex; align-items:center; justify-content:center; gap:10px;">
                    <span id="detectionIcon" style="display:inline-block; font-size:24px;">🔄</span>
                    <span id="detectionText">이동중 </span>
                </div>
            </div>
        </div>
    </div>

<script>
    const destTitle = document.getElementById("destTitle");
    const destCoords = document.getElementById("destCoords");
    const statusText = document.getElementById("statusText");
    const detectionIcon = document.getElementById("detectionIcon");
    const detectionText = document.getElementById("detectionText");
    const detectionStatus = document.getElementById("detectionStatus");
    const countdownOverlay = document.getElementById("countdownOverlay");

    const POLL_INTERVAL = 500;
    let lastCountdown = null;

    let dest = []; // 목적지가 저장될 배열

    async function loadDestinations() {
        try {
            const response = await fetch('/get_destinations');
            if (!response.ok) {
                throw new Error('서버 응답 오류');
            }
            const data = await response.json();

            console.log("서버에서 받은 목적지 데이터:", data);  // <- 여기 확인!

            dest = [data.destinations.x, 
                    data.destinations.z, 
                    data.destinations.idx,
                    data.destinations.over];

            if (dest && dest.length > 0) {
                if (dest[3] == 0) {
                    destTitle.innerText = `📡 목적지 ${dest[2] + 1} 전송 완료`;
                    destCoords.innerText = `📍 좌표: (${dest[0]}, ${dest[1]})`;

                    // startSpinning();
                    // await delay(10000);
                    // stopSpinning();
                    // await delay(500);
                } else {
                    destTitle.innerText = "🚩 모든 목적지 도착 완료!";
                    destCoords.innerText = "";  
                    detectionStatus.style.display = "none";  
                    statusText.style.display = "block";  
                    statusText.innerText = "임무 종료";  
        }
            } else {
            console.warn("목적지가 비어 있습니다.");
        }
        } catch (err) {
            console.error("목적지 불러오기 실패:", err);
    }
}

    async function fetchAimStatus() {
        try {
            const response = await fetch('/get_action', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({aim_ready: true})
            });
            const data = await response.json();

            if (data.aim_ready) {
                if (data.fire) {
                    countdownOverlay.style.display = "block";
                    countdownOverlay.textContent = "🔥 발사!";
                    lastCountdown = null;
                    detectionText.textContent = "발사 완료";
                } else {
                    if (lastCountdown !== data.remaining) {
                        countdownOverlay.style.display = "block";
                        countdownOverlay.textContent = data.remaining;
                        countdownOverlay.classList.add('countdown-number');
                        setTimeout(() => {
                            countdownOverlay.classList.remove('countdown-number');
                        }, 1000);
                        lastCountdown = data.remaining;
                        detectionText.textContent = "조준 중...";
                    }
                }
            } else {
                countdownOverlay.style.display = "none";
                detectionText.textContent = "탐지 대기중...";
                lastCountdown = null;
            }
        } catch (err) {
            console.error("서버 통신 에러:", err);
        }
    }

    function delay(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
    }

    function startSpinning() {
        detectionIcon.style.animation = "spin 2s linear infinite";
        detectionText.innerText = "탐지 대기중...";
        detectionStatus.style.display = "flex";
        statusText.style.display = "none";
    }

    function stopSpinning() {
        detectionIcon.style.animation = "none";
        detectionText.innerText = "도착!";
    }

    // ✅ 예: 첫 목적지를 전송하고 시뮬레이션 시작
    // 아래 부분은 상황에 맞게 변경 가능
    // sendDestinations(10, 20, 30, 40, 50, 60);

    // 계속 Aim 상태 체크
    setInterval(fetchAimStatus, POLL_INTERVAL);
    window.onload = () => {
        console.log("페이지 로드됨, 목적지 불러오기 시작");
        setInterval(loadDestinations, 500);
};
</script>
</body>
</html>
